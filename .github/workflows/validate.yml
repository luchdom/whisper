name: Validate standalone distributions

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: windows-x64
          - runner: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.12.10
      - name: Install locked desktop dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare backend on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv backend/.venv
          backend/.venv/Scripts/python.exe -m pip install --disable-pip-version-check --constraint backend/constraints.txt --editable backend
      - name: Prepare backend on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --disable-pip-version-check --constraint backend/constraints.txt --editable backend
      - name: Validate desktop
        run: pnpm test
      - name: Check desktop syntax
        run: pnpm run check
      - name: Validate backend on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: backend
        run: .venv/Scripts/python.exe -m unittest discover -s tests -v
      - name: Validate backend on macOS
        if: runner.os == 'macOS'
        shell: bash
        working-directory: backend
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Build standalone runtime and SBOM
        env:
          MEETING_TRANSCRIBER_REQUIRE_PYTHON_PATCH: 3.12.10
        run: pnpm run prepare:distribution
      - name: Build unpacked app
        run: pnpm exec electron-builder --dir
      - name: Verify packaged runtime
        run: pnpm run verify:distribution -- --packaged
